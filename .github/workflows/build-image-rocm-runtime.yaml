---
name: build-image-rocm-runtime
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: f5daaa3c-rocm-custom
      rocm_version:
        description: ROCm base image version
        required: true
        default: "7.2.4"
      gpu_target:
        description: GPU target arch
        required: true
        default: gfx1151
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Maximize disk (from-source ROCr + clr + llama.cpp)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/lib/node_modules /usr/share/swift \
                      /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v6
      - name: Ignore the repo tree as build context (Dockerfile clones its own sources)
        run: printf '*\n' > .dockerignore
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: .devops/rocm-strix-runtime.Dockerfile
          target: server
          build-args: |
            ROCM_VERSION=${{ inputs.rocm_version }}
            GPU_TARGET=${{ inputs.gpu_target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:buildcache-runtime
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:buildcache-runtime,mode=max,image-manifest=true
      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
