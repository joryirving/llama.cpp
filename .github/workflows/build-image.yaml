---
name: build-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "0.4.3"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v6
      - id: buildx
        uses: docker/setup-buildx-action@v3
      - name: ccache cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ccache-mount
          key: ccache-vulkan-${{ github.sha }}
          restore-keys: |
            ccache-vulkan-
      - name: Restore ccache into buildkit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache-mount": "/ccache"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: .devops/vulkan-ccache.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}
      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
