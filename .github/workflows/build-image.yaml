---
name: build-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (no leading v)
        required: true
        default: "0.3.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: .devops/vulkan.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
