---
name: build-image-rocm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "0.5.6-rocm"
      arch:
        description: AMDGPU targets
        required: true
        default: "gfx1151"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h / | tail -1
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: .devops/rocm.Dockerfile
          target: server
          push: true
          build-args: |
            ROCM_DOCKER_ARCH=${{ inputs.arch }}
            APP_REVISION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}
      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
