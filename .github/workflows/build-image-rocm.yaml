---
name: build-image-rocm
on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: pwilkin/llama.cpp ref (branch or commit) to build
        required: true
        default: f5daaa3cfa6358e5dd398911ec741813745a5440
      rocm_version:
        description: ROCm base image version
        required: true
        default: "7.2.4"
      gpu_target:
        description: GPU target arch
        required: true
        default: gfx1151
      tag:
        description: Image tag
        required: true
        default: f5daaa3c-rocm
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY"
      - name: Checkout build tooling (this fork)
        uses: actions/checkout@v6
        with:
          path: tooling
      - name: Checkout llama.cpp source (pwilkin)
        uses: actions/checkout@v6
        with:
          repository: pwilkin/llama.cpp
          ref: ${{ inputs.llama_ref }}
          path: src
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./src
          file: ./tooling/.devops/rocm-strix.Dockerfile
          target: server
          build-args: |
            ROCM_VERSION=${{ inputs.rocm_version }}
            GPU_TARGET=${{ inputs.gpu_target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:buildcache-rocm
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:buildcache-rocm,mode=max,image-manifest=true
      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/llama-qwen4exp:${{ inputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
